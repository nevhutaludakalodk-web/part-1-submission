<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hope for All Foundation | Volunteer & Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Navigation Header -->
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-title">
            <h2>Get Involved / Make an Enquiry</h2>
            <p>Apply as a volunteer, partner as a corporate sponsor, or request program assistance.</p>
        </section>

        <!-- Interactive Form Section -->
        <section class="form-section">
            <div class="form-container">
                <form action="#" method="POST" class="enquiry-form">
                    
                    <!-- Applicant Personal Details -->
                    <fieldset>
                        <legend>Personal Information</legend>
                        
                        <div class="form-group">
                            <label for="fullname">Full Name & Surname *</label>
                            <input type="text" id="fullname" name="fullname" placeholder="e.g., Jane Doe" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" placeholder="e.g., jane@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="e.g., 015 291 0000" required>
                        </div>
                    </fieldset>

                    <!-- Category Selection -->
                    <fieldset>
                        <legend>Enquiry Type & Support Options</legend>

                        <div class="form-group">
                            <label for="enquiry-type">Reason for Enquiry *</label>
                            <select id="enquiry-type" name="enquirytype" required>
                                <option value="">-- Please Select --</option>
                                <option value="volunteer">Volunteer Application</option>
                                <option value="sponsor">Corporate Sponsorship</option>
                                <option value="donation">Financial Donation</option>
                                <option value="assistance">Request Social Assistance</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="program-interest">Preferred Program Interest</label>
                            <select id="program-interest" name="program">
                                <option value="feeding">Emergency Feeding Kitchen</option>
                                <option value="shelter">Shelter Assistance & Care</option>
                                <option value="skills">Skills Workshops & Training</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="message">Detailed Message / Additional Information *</label>
                            <textarea id="message" name="message" rows="5" placeholder="Write your message or availability details here..." required></textarea>
                        </div>
                    </fieldset>

                    <!-- Submit Action Button -->
                    <button type="submit" class="btn btn-primary">Submit Application</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Hope for All Foundation. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
